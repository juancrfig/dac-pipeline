name: AGENTS.md Validator

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.github/workflows/agents-md-validator.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install openai

      - name: Run AGENTS.md validation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VALIDATOR_MODEL: ${{ vars.VALIDATOR_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          python scripts/validate-agents-md.py \
            --agents-md AGENTS.md \
            --template AGENTS-TEMPLATE.md \
            --pr-number "$PR_NUMBER"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agents-md-validation-report
          path: agents-md-validation-report.md
          retention-days: 30
