[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dac-pipeline"
version = "0.1.0"
description = "AI-native documentation that stays true to your codebase"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Nous Research"}
]
keywords = ["documentation", "ci", "ai", "agents", "docs-as-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tree-sitter>=0.20",
    "tree-sitter-python>=0.20",
    "tree-sitter-javascript>=0.20",
    "tree-sitter-typescript>=0.20",
    "tree-sitter-go>=0.20",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.30",
    "openai>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]

[project.scripts]
dac = "dac.cli:main"

[project.urls]
Homepage = "https://github.com/nousresearch/dac-pipeline"
Repository = "https://github.com/nousresearch/dac-pipeline"
Issues = "https://github.com/nousresearch/dac-pipeline/issues"

[tool.hatch.build.targets.wheel]
packages = ["dac"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
